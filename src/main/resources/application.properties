springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Connection settings. Change these anytime without editing code:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# Railway can use its DATABASE_URL (postgres:// or postgresql://) instead of DB_URL.
# Username and password may be inside that URL, or set with DB_USERNAME and DB_PASSWORD.
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD also work.
# A .env file in the working directory supplies the same keys when the variables are not already set.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moneytracking}
spring.datasource.username=${DB_USERNAME:moneytracking}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
